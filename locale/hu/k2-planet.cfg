[space-location-name]
k2-planet=K2

[space-location-description]
k2-planet=Egy kietlen, sivár és viharos világ, ahol semmilyen növény- vagy állatvilág nem él meg. Bár a felszín halott, a homok szétszórt Krastorio 2 nyersanyag-lelőhelyeket rejt: imersite-ot, ritkafémet és ásványvizet.

[technology-name]
planet-discovery-k2-planet=K2 bolygó felfedezése

[technology-description]
planet-discovery-k2-planet=A K2 felfedezése, egy zord és száraz bolygóé, amely elengedhetetlen a ritkafémek megszerzéséhez és a fúziós energia eléréséhez.

[space-connection-name]
nauvis-k2-planet=Nauvis - K2 útvonal
k2-planet-fulgora=K2 - Fulgora útvonal

[recipe-name]
k2-filter-mineral-water=Ásványvíz szűrése
k2-advanced-imersite-processing=Fejlett imersite-feldolgozás

[recipe-description]
k2-filter-mineral-water=Az ásványvizet tiszta vízzé szűri.
k2-advanced-imersite-processing=A nyers imersite hatékonyabb feldolgozása gőz és salétromsav segítségével, ami némi extra ritkafémércet is ad.

[mod-setting-name]
k2-remove-nauvis-rare-metals=Ritkafém eltávolítása a korai (Nauvis) receptekből
k2-allow-nauvis-rare-metals=Ritkafém engedélyezése Nauvison
k2-use-old-fulgora-gen=Régi Fulgora-alapú generálás használata

k2-production-location=Hol lehet gyártani a K2 dolgait
k2-extra-water=Plusz a K2-n: víz (tavak)
k2-extra-iron-ore=Plusz a K2-n: vasérc
k2-extra-copper-ore=Plusz a K2-n: rézérc
k2-extra-coal=Plusz a K2-n: szén
k2-extra-stone=Plusz a K2-n: kő
k2-extra-crude-oil=Plusz a K2-n: kőolaj
k2-extra-uranium-ore=Plusz a K2-n: uránérc

[mod-setting-description]
k2-remove-nauvis-rare-metals=Ha be van kapcsolva, kiveszi a ritkafémet a kék áramkör (Processing unit), az atomreaktor, a nukleáris mozdony és az MK2 elektromos bányafúró összetevői közül. Nagyon hasznos meglévő mentéseknél, ahol a Nauvis ritkafém-lelőhelyek nélkül generálódott.
k2-allow-nauvis-rare-metals=Ha be van kapcsolva, a kezdőbolygón (Nauvis) is generálódhatnak ritkafémérc-lelőhelyek. Ha ki van kapcsolva, a ritkafém-feldolgozás (Rare metal processing) sima kutatás lesz, így a K2 bolygó ritkafém nélkül is elérhető. Ilyenkor a "Ritkafém eltávolítása a korai (Nauvis) receptekből" beállítás is maradjon bekapcsolva.
k2-use-old-fulgora-gen=Ha be van kapcsolva, a K2 bolygó az eredeti Fulgora-alapú terepet használja (szigetekkel, olaj és roncsok nélkül) az egybefüggő lila sivatag helyett.

k2-production-location=Bárhol: semmi sincs a K2 bolygóhoz kötve, csak a nyersanyagok vannak ott.\nVegyes (alapértelmezett): a kőfejtő, az anyaggyár K2-nyersanyagos receptjei, a Superior logisztika és a fejlett technológiai kártya (a hűtött változatával együtt) csak a K2-n készíthető.\nVegyes + minden imersite-os: mint a vegyes, de ezen felül minden recept, ami imersite-ot használ (nyers, por vagy kristály), csak a K2-n készíthető.
k2-extra-water=Ha be van kapcsolva, a K2 bolygón víztavak is generálódnak. A mennyiségük a térképbeállítások "Water" csúszkáját követi.
k2-extra-iron-ore=Ha be van kapcsolva, a K2 bolygón vasérc is generálódik.
k2-extra-copper-ore=Ha be van kapcsolva, a K2 bolygón rézérc is generálódik.
k2-extra-coal=Ha be van kapcsolva, a K2 bolygón szén is generálódik.
k2-extra-stone=Ha be van kapcsolva, a K2 bolygón kő is generálódik.
k2-extra-crude-oil=Ha be van kapcsolva, a K2 bolygón kőolaj is generálódik.
k2-extra-uranium-ore=Ha be van kapcsolva, a K2 bolygón uránérc is generálódik.

[string-mod-setting]
k2-production-location-nauvis=Bárhol (minden marad a Nauvison)
k2-production-location-mixed=Vegyes (alapértelmezett)
k2-production-location-imersite=Vegyes + minden imersite-os

[surface-property-name]
is-k2-planet=K2 bolygó felszíne

