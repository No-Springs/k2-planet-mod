[space-location-name]
k2-planet=K2

[space-location-description]
k2-planet=A barren, desolate and stormy world, completely devoid of flora and fauna. While the surface is dead, its sands hide scattered deposits of Krastorio 2 resources: Imersite, Rare metals and Mineral water.

[technology-name]
planet-discovery-k2-planet=Planet discovery K2

[technology-description]
planet-discovery-k2-planet=Discover K2, a harsh and dry planet essential for acquiring rare metals and unlocking fusion energy.

[space-connection-name]
nauvis-k2-planet=Nauvis - K2 route
k2-planet-fulgora=K2 - Fulgora route

