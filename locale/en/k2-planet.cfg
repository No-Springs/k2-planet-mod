[mod-setting-description]
k2-remove-nauvis-rare-metals=If enabled, removes Rare metals from the ingredients of the Processing unit, Nuclear reactor, Nuclear locomotive and Electric mining drill MK2. Very useful for existing saves where Nauvis was generated without rare metal deposits.
k2-allow-nauvis-rare-metals=If enabled, Rare metal ore deposits can also generate on the starting planet (Nauvis). If disabled, Rare metal processing becomes a normal research, so you can still reach the K2 planet. Keep "Remove Rare metals from early (Nauvis) recipes" enabled as well.
k2-use-old-fulgora-gen=If enabled, the K2 planet generates with the original Fulgora-based terrain (islands, no oil or scrap) instead of the continuous violet desert.

k2-production-location=Everywhere: nothing is restricted to the K2 planet, only the resources are there.\nMixed (default): the Quarry drill, the Matter plant recipes for K2 resources, the Superior logistics and the Advanced tech card (with its cooled version) can only be made on K2.\nMixed + everything with Imersite: like Mixed, plus every recipe that uses Imersite (raw, powder or crystal) can only be made on K2.
k2-extra-water=If enabled, lakes of water also generate on the K2 planet. Their amount follows the "Water" map setting.
k2-extra-iron-ore=If enabled, iron ore also generates on the K2 planet.
k2-extra-copper-ore=If enabled, copper ore also generates on the K2 planet.
k2-extra-coal=If enabled, coal also generates on the K2 planet.
k2-extra-stone=If enabled, stone also generates on the K2 planet.
k2-extra-crude-oil=If enabled, crude oil also generates on the K2 planet.
k2-extra-uranium-ore=If enabled, uranium ore also generates on the K2 planet.

[string-mod-setting]
k2-production-location-nauvis=Everywhere (everything stays on Nauvis)
k2-production-location-mixed=Mixed (default)
k2-production-location-imersite=Mixed + everything with Imersite

