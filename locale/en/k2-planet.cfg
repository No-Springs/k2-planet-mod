k2-filter-mineral-water=Mineral water filtration
k2-advanced-imersite-processing=Advanced imersite processing

[recipe-description]
k2-filter-mineral-water=Filters mineral water into clean water.
k2-advanced-imersite-processing=More efficient processing of raw imersite using steam and nitric acid, yielding some extra rare metal ore.

